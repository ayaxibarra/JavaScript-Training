<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Fotos Asíncrona</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
        }
        h1 {
            margin-bottom: 25px;
        }
        /* 3. Estilos opcionales para organizar el contenedor de la galería */
        #galeria-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Estilos visuales para las imágenes creadas dinámicamente */
        #galeria-container img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        #galeria-container img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <h1>Galería de Fotos</h1>
    <p>Hacé clic en cualquier imagen para ver su título en una alerta.</p>

    <!-- 3. Contenedor vacío para la galería -->
    <div id="galeria-container"></div>

    <!-- Enlace al archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Muebles - Mueblería Hermanos Jota</title>
    <style>
        /* Estilos básicos opcionales para una mejor visualización */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #product-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .product-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .product-card h3 {
            font-size: 1.1rem;
            color: #333;
            margin: 15px 0 10px 0;
        }
        .product-card p {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>Catálogo de Muebles</h1>

    <!-- 2. Contenedor vacío con id="product-container" -->
    <div id="product-container"></div>

    <!-- Enlace al archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>

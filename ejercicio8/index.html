<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferencias de Usuario con localStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #f0f0f0;
        }
        #btn-guardar {
            background-color: #e8f5e9;
            color: #2e7d32;
            border-color: #c8e6c9;
        }
        #btn-cargar {
            background-color: #e3f2fd;
            color: #1565c0;
            border-color: #bbdefb;
        }
    </style>
</head>
<body>

    <h1>Gestión de Preferencias</h1>
    <p>Hacé clic en los botones para guardar o cargar tus preferencias en el localStorage.</p>

    <!-- 2. Botones de guardar y cargar -->
    <button id="btn-guardar">Guardar Preferencias</button>
    <button id="btn-cargar">Cargar Preferencias</button>

    <!-- Enlace al archivo JavaScript -->
    <script src="app.js"></script>
</body>
</html>
